name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        env:
          NODE_ENV: test
          TBD_USERNAME: test@example.com
          TBD_PASSWORD: test-password
          TBD_TOTP_SECRET: JBSWY3DPEHPK3PXP
          PROXY_API_KEY: test-api-key
        run: bun test
