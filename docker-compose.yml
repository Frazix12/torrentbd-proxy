services:
  torrentbd-proxy:
    container_name: torrentbd-proxy
    build: .
    init: true
    ports:
      - "6950:6950"
    env_file: .env
    environment:
      - PORT=6950
      - CLOAK_PROFILE_DIR=/data/cloak-profile
    volumes:
      - cloak-profile:/data/cloak-profile
    shm_size: 2gb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6950/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cloak-profile:
